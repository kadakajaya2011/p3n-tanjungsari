<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>P3NR · Buku Register Nikah · Kecamatan Tanjungsari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4EFE2;
    --paper-deep:#ECE4D0;
    --line:#D9CDA9;
    --ink:#262A1F;
    --ink-soft:#655F4C;
    --forest:#1E4D3B;
    --forest-dark:#123328;
    --forest-tint:#E4EBE4;
    --gold:#A9812F;
    --gold-tint:#F1E6C8;
    --stamp-red:#A5382E;
    --stamp-red-tint:#F3DFDA;
    --stamp-blue:#2E4A73;
    --stamp-blue-tint:#DEE5EF;
    --shadow: 0 6px 18px rgba(38,41,31,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:'Inter',sans-serif;}
  #app{display:flex;min-height:600px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .serif{font-family:'Fraunces',serif;}

  /* ===== Sidebar ===== */
  .sidebar{
    width:230px;flex-shrink:0;background:var(--forest-dark);color:#EFE9D8;
    display:flex;flex-direction:column;padding:22px 0;
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px);
  }
  .brand{padding:0 20px 18px 20px;border-bottom:1px solid rgba(239,233,216,0.18);margin-bottom:10px;}
  .brand .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  .brand h1{font-family:'Fraunces',serif;font-size:21px;font-weight:700;margin:5px 0 2px 0;line-height:1.15;}
  .brand .wil{font-size:11.5px;color:#C9C2A8;}
  nav{display:flex;flex-direction:column;padding:8px 10px;gap:2px;}
  nav button{
    all:unset;cursor:pointer;padding:10px 12px;border-radius:3px;font-size:13.5px;
    display:flex;align-items:center;gap:10px;color:#DAD4BE;transition:background .15s;
  }
  nav button .ic{font-family:'Fraunces',serif;font-weight:700;font-size:13px;color:var(--gold);width:16px;text-align:center;}
  nav button:hover{background:rgba(239,233,216,0.08);}
  nav button.active{background:rgba(239,233,216,0.14);color:#fff;font-weight:600;}
  .sidebar-foot{margin-top:auto;padding:14px 20px 4px 20px;font-size:10.5px;color:#8C876F;border-top:1px solid rgba(239,233,216,0.14);}

  /* ===== Main ===== */
  main{flex:1;padding:30px 36px 40px 36px;overflow-y:auto;max-height:900px;
    background-image: repeating-linear-gradient(180deg, transparent 0px, transparent 33px, var(--line) 34px);
    background-position: 0 78px;
  }
  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--forest-dark);margin:0;}
  .page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .rule{border:none;border-top:2px solid var(--forest-dark);margin:12px 0 22px 0;position:relative;}
  .rule:after{content:"";position:absolute;left:0;top:2px;width:60px;height:2px;background:var(--gold);}

  .btn{
    all:unset;cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:3px;letter-spacing:.01em;
  }
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:hover{background:var(--forest-dark);}
  .btn-ghost{background:transparent;color:var(--forest-dark);border:1px solid var(--forest-dark);}
  .btn-ghost:hover{background:var(--forest-tint);}
  .btn-danger{background:transparent;color:var(--stamp-red);border:1px solid var(--stamp-red);}
  .btn-danger:hover{background:var(--stamp-red-tint);}
  .btn-sm{padding:6px 11px;font-size:11.5px;}

  /* ===== Dashboard ===== */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--paper-deep);border:1px solid var(--line);border-radius:4px;padding:15px 16px;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--forest-dark);line-height:1;}
  .stat-card .lbl{font-size:11px;color:var(--ink-soft);margin-top:6px;text-transform:uppercase;letter-spacing:.05em;}
  .panel{background:var(--paper-deep);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:20px;}
  .panel h3{font-family:'Fraunces',serif;font-size:15.5px;margin:0 0 14px 0;color:var(--forest-dark);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
  .bar-row .bl{width:118px;flex-shrink:0;color:var(--ink-soft);}
  .bar-track{flex:1;height:9px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-row .bn{width:24px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);}

  .recent-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .recent-row:last-child{border-bottom:none;}
  .recent-row .nm{font-weight:600;}
  .recent-row .sub{color:var(--ink-soft);font-size:11px;}

  /* ===== Table / Register ===== */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);
    border-radius:3px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;}
  .search-box{flex:1;min-width:180px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  thead tr{background:var(--forest-tint);}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--forest-dark);padding:10px 12px;border-bottom:2px solid var(--forest-dark);}
  td{padding:11px 12px;font-size:12.5px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--gold-tint);cursor:pointer;}
  .nomor{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .stamp-ic{font-size:34px;margin-bottom:8px;}

  /* status badge (stamp) */
  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
    padding:5px 10px;border-radius:20px;border:1.5px solid; white-space:nowrap;
  }
  .st-Diajukan{color:var(--ink-soft);border-color:var(--ink-soft);background:transparent;}
  .st-BerkasLengkap{color:var(--gold);border-color:var(--gold);background:var(--gold-tint);}
  .st-Terjadwal{color:var(--stamp-blue);border-color:var(--stamp-blue);background:var(--stamp-blue-tint);}
  .st-Terlaksana{color:var(--forest);border-color:var(--forest);background:var(--forest-tint);}
  .st-Dibatalkan{color:var(--stamp-red);border-color:var(--stamp-red);background:var(--stamp-red-tint);}
  .st-RegMasuk{color:var(--stamp-blue);border-color:var(--stamp-blue);background:var(--stamp-blue-tint);}
  .st-RegKeluar{color:var(--stamp-red);border-color:var(--stamp-red);background:var(--stamp-red-tint);}

  /* ===== Form ===== */
  .form-section{background:var(--paper-deep);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:16px;}
  .form-section h3{font-family:'Fraunces',serif;font-size:13.5px;color:var(--forest-dark);margin:0 0 16px 0;
    text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
  .form-section h3:before{content:"";width:16px;height:2px;background:var(--gold);display:inline-block;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:3px;}
  .chk input{accent-color:var(--forest);width:15px;height:15px;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

  /* ===== Detail / Print ===== */
  .doc{background:#fff;border:1px solid var(--line);border-radius:4px;padding:36px 40px;position:relative;}
  .doc-head{text-align:center;border-bottom:3px double var(--forest-dark);padding-bottom:14px;margin-bottom:20px;}
  .doc-head.doc-head-logo{display:flex;align-items:center;gap:14px;text-align:center;}
  .doc-head .kop-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
  .doc-head .kop-text{flex:1;}
  .doc-head .kop1{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .doc-head .kop2{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--forest-dark);margin:2px 0;}
  .doc-head .kop3{font-size:10.5px;color:var(--ink-soft);}
  .doc-head .kop4{font-size:10px;color:var(--ink-soft);margin-top:1px;}
  .doc-title{text-align:center;margin:18px 0 22px 0;}
  .doc-title .dt1{font-family:'Fraunces',serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;}
  .doc-title .dt2{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:18px;}
  .doc-box h4{font-family:'Fraunces',serif;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--forest-dark);margin:0 0 10px 0;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .dl-row{display:flex;font-size:12px;margin-bottom:6px;}
  .dl-row .dk{width:120px;flex-shrink:0;color:var(--ink-soft);}
  .dl-row .dv{font-weight:500;}
  .doc-note{font-size:11.5px;color:var(--ink-soft);background:var(--paper-deep);border-radius:3px;padding:10px 12px;margin-top:8px;}

  .stampbig{
    position:absolute;top:38px;right:44px;width:112px;height:112px;border-radius:50%;
    border:3px double; display:flex;align-items:center;justify-content:center;text-align:center;
    transform:rotate(-11deg);opacity:.92;
  }
  .stampbig .sb-txt{font-family:'Fraunces',serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;line-height:1.25;}
  .berkas-mini{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;margin-top:6px;}
  .berkas-mini .bm{font-size:11.5px;display:flex;gap:6px;align-items:flex-start;}
  .bm .bx{width:13px;flex-shrink:0;}

  /* ===== Formulir cetak resmi (N1/N2/N4/N5/dll) ===== */
  .form-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .form-chip{
    all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:20px;
    border:1.5px solid var(--forest); color:var(--forest-dark); background:#fff;
  }
  .form-chip:hover{background:var(--forest-tint);}
  .form-chip .fc-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);margin-right:6px;}
  .meta-bar{display:flex;gap:14px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;}
  .meta-bar .field{margin-bottom:0;}
  .letter-code{position:absolute;top:20px;left:24px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .doc-body p{font-size:12.5px;line-height:1.85;text-align:justify;margin:0 0 12px 0;}
  .fill{border-bottom:1px dotted var(--ink-soft);padding:0 2px;font-weight:600;}
  .data-table{width:100%;border-collapse:collapse;margin:6px 0 16px 0;}
  .data-table td{padding:3px 6px;font-size:12px;vertical-align:top;}
  .data-table td.k{width:190px;color:var(--ink-soft);white-space:nowrap;}
  .data-table td.sep{width:12px;color:var(--ink-soft);}
  .sign-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:34px;}
  .sign-grid.single{grid-template-columns:1fr;justify-items:center;}
  .sign-block{text-align:center;font-size:12px;width:100%;max-width:230px;justify-self:center;}
  .sign-block .role{color:var(--ink-soft);margin-bottom:2px;}
  .sign-block .space{height:64px;}
  .sign-block .name-line{border-top:1px solid var(--ink);padding-top:5px;font-weight:700;}
  .sign-block .materai{font-size:10px;color:var(--ink-soft);font-style:italic;}
  .print-listing{width:100%;border-collapse:collapse;margin:10px 0;}
  .print-listing th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--forest-dark);padding:7px 8px;border-bottom:2px solid var(--forest-dark);background:var(--forest-tint);}
  .print-listing td{padding:7px 8px;font-size:11.5px;border-bottom:1px solid var(--line);}
  .lap-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width:700px){ .lap-stats{grid-template-columns:repeat(2,1fr);} }
  .rinci-entry{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:14px;page-break-inside:avoid;}
  .rinci-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line);font-size:13px;}
  .rinci-num{font-family:'Fraunces',serif;font-weight:700;color:var(--forest-dark);}


  /* ===== N2 sesuai contoh Model N.2 / Kepdirjen Bimas Islam No. 473 Tahun 2020 ===== */
  .n2-page{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;padding:0 8px;min-height:1000px;font-size:12px;line-height:1.45;}
  .n2-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;line-height:1.35;margin-bottom:18px;}
  .n2-top-left div:first-child{font-weight:700;}
  .n2-model{font-weight:700;font-size:13px;}
  .n2-subject{margin:8px 0 18px 0;}
  .n2-recipient{margin:10px 0 18px 22px;line-height:1.45;}
  .n2-body p{margin:0 0 10px 0;text-align:justify;}
  .n2-person-table{width:100%;border-collapse:collapse;margin:0 0 10px 0;}
  .n2-person-table td{padding:2px 3px;border:none;vertical-align:top;}
  .n2-person-table .num{width:24px;}
  .n2-person-table .label{width:205px;}
  .n2-person-table .sep{width:12px;text-align:center;}
  .n2-person-table .value{font-weight:600;}
  .n2-check-title{margin:16px 0 6px 0;}
  .n2-checklist{width:100%;border-collapse:collapse;margin-top:4px;}
  .n2-checklist th,.n2-checklist td{border:1px solid #111;padding:4px 5px;font-size:10.5px;vertical-align:top;}
  .n2-checklist th{font-weight:700;text-align:center;}
  .n2-checklist .no{width:30px;text-align:center;}
  .n2-checklist .ada,.n2-checklist .tidak{width:48px;text-align:center;}
  .n2-check{font-size:14px;line-height:1;}
  .n2-closing{margin-top:12px;text-align:justify;}
  .n2-receive{margin-top:16px;}
  .n2-receive-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .n2-receive-table td{border:none;vertical-align:top;width:50%;padding:0 5px;text-align:center;}
  .n2-sign{margin-top:12px;text-align:center;}
  .n2-sign .space{height:48px;}
  .n2-sign .name{font-weight:700;text-decoration:underline;}
  .n2-print-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px 0;}
  .n2-print-controls label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .n2-print-controls select{min-width:170px;}
  @media print{.n2-page{padding:0;min-height:0}.n2-print-controls{display:none!important}.n2-checklist{break-inside:avoid}}
  .n4-page{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;padding:0 8px;min-height:1000px;font-size:12px;line-height:1.45;}
  .n4-top{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;line-height:1.35;margin-bottom:42px;}
  .n4-lamp{font-weight:700;}
  .n4-model{font-weight:700;font-size:13px;}
  .n4-title{text-align:center;font-weight:700;text-decoration:underline;font-size:14px;margin:0 0 38px 0;}
  .n4-body p{margin:0 0 10px 0;}
  .n4-section-title{font-size:12px;margin:0 0 22px 0;}
  .n4-section-title.n4-b{margin-top:10px;margin-bottom:22px;}
  .n4-fields{width:100%;border-collapse:collapse;margin:0 0 18px 0;}
  .n4-fields td{padding:2.5px 2px;vertical-align:top;border:none;font-size:12px;}
  .n4-num{width:28px;text-align:right;padding-right:10px!important;}
  .n4-label{width:285px;}
  .n4-sep{width:18px;text-align:center;}
  .n4-value{font-weight:400;}
  .n4-value.strong{font-weight:700;}
  .n4-value.mono{letter-spacing:.01em;}
  .n4-statement{margin-top:26px!important;text-align:justify;line-height:1.5;}
  .n4-closing{margin-top:8px!important;}
  .n4-date{text-align:right;margin-top:42px;font-size:12px;}
  .n4-sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:90px;margin-top:38px;text-align:center;font-size:12px;}
  .n4-sign-space{height:68px;}
  .n4-name{font-weight:700;}
  @media print{.n4-page{padding:0;min-height:0}.n4-title{margin-bottom:38px}}

  /* ===== Surat Pernyataan Status ===== */
  .status-page{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff;padding:0 8px;min-height:1000px;font-size:12px;line-height:1.55;}
  .status-title{text-align:center;font-weight:700;text-decoration:underline;font-size:15px;margin:8px 0 30px 0;}
  .status-intro{margin:0 0 12px 0;}
  .status-fields{width:100%;border-collapse:collapse;margin:0 0 22px 0;}
  .status-fields td{padding:2px 3px;vertical-align:top;border:none;}
  .status-fields .num{width:28px;text-align:right;padding-right:8px!important;}
  .status-fields .label{width:250px;}
  .status-fields .sep{width:18px;text-align:center;}
  .status-fields .value{font-weight:600;}
  .status-statement{margin:0 0 10px 0;text-align:justify;line-height:1.7;}
  .status-closing{margin:0;text-align:justify;line-height:1.7;}
  .status-date{text-align:right;margin-top:28px;}
  .status-sign{text-align:center;width:280px;margin:8px 0 0 auto;}
  .status-sign-space{height:82px;}
  .status-name{font-weight:700;text-decoration:underline;}
  .status-print-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px 0;}
  .status-print-controls label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .status-print-controls select{min-width:170px;}
  @media print{.status-page{padding:0;min-height:0}.status-print-controls{display:none!important}}


  /* ===== Keterangan Wali sesuai contoh PDF ===== */
  .wali-page{font-family:"Times New Roman",Times,serif;color:#111;background:#fff;padding:0 8px;min-height:1000px;font-size:13px;line-height:1.55;}
  .wali-title{text-align:center;font-weight:700;text-decoration:underline;font-size:16px;margin:8px 0 10px 0;}
  .wali-number{text-align:center;font-size:13px;margin-bottom:22px;}
  .wali-intro{margin:0 0 8px 0;}
  .wali-section-title{font-weight:700;margin:8px 0 3px 0;}
  .wali-fields{width:100%;border-collapse:collapse;margin:0 0 9px 0;}
  .wali-fields td{border:none;padding:1px 3px;vertical-align:top;}
  .wali-fields .num{width:25px;text-align:right;padding-right:8px;}
  .wali-fields .label{width:275px;}
  .wali-fields .sep{width:16px;text-align:center;}
  .wali-fields .value{font-weight:600;}
  .wali-explain{margin:9px 0 5px 0;text-align:justify;}
  .wali-closing{margin:12px 0 0 0;text-align:justify;}
  .wali-date{text-align:right;margin-top:22px;}
  .wali-sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:8px;text-align:center;font-size:12px;}

/* ===================== PENYIMPANAN LOKAL (SQLite via sql.js) ===================== */
/* Mesin datanya SQLite sungguhan (tabel settings & records), dijalankan di memori lewat
   sql.js. Supaya tetap auto-save tanpa perlu buka/simpan file manual, setiap ada
   perubahan, seluruh database di-serialize jadi bytes dan disimpan otomatis ke IndexedDB.
   Sepenuhnya offline: koneksi internet hanya dipakai sekali untuk memuat aset (font,
   pustaka sql.js). Tombol "Ekspor (.db)" mengunduh database ini apa adanya, sehingga
   filenya bisa dibuka di aplikasi SQLite lain (mis. DB Browser for SQLite). */
const IDB_NAME = 'p3nr_db';
const IDB_STORE = 'kv';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result !== undefined ? req.result : null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}

let sqliteDb = null;
const SQLITE_SCHEMA = `
  CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT);
  CREATE TABLE IF NOT EXISTS records (id TEXT PRIMARY KEY, nomor TEXT, tanggalDaftar TEXT, data TEXT);
`;

async function initDatabase(){
  const SQLlib = await getSQL();
  let bytes = null;
  try{ bytes = await idbGet('p3nr_sqlite_bytes'); }catch(e){}
  if(bytes){
    sqliteDb = new SQLlib.Database(new Uint8Array(bytes));
    sqliteDb.run(SQLITE_SCHEMA);
    return;
  }
  sqliteDb = new SQLlib.Database();
  sqliteDb.run(SQLITE_SCHEMA);
  // Migrasi otomatis dari versi lama (JSON blob di IndexedDB), kalau ada.
  try{
    const oldRecords = await idbGet('p3nr_records');
    if(oldRecords){
      const arr = JSON.parse(oldRecords);
      const ins = sqliteDb.prepare("INSERT OR REPLACE INTO records (id, nomor, tanggalDaftar, data) VALUES (?, ?, ?, ?)");
      arr.forEach(r=> ins.run([r.id||'', r.nomor||'', r.tanggalDaftar||'', JSON.stringify(r)]));
      ins.free();
    }
  }catch(e){}
  try{
    const oldPetugas = await idbGet('p3nr_petugas');
    if(oldPetugas) sqliteDb.run("INSERT OR REPLACE INTO settings (key, value) VALUES ('petugas', ?)", [oldPetugas]);
  }catch(e){}
  await persistDatabaseToIndexedDB();
}

async function persistDatabaseToIndexedDB(){
  try{ await idbSet('p3nr_sqlite_bytes', sqliteDb.export()); }catch(e){ showToast("Gagal menyimpan database."); }
}

async function loadState(){
  try{
    await initDatabase();
    const resRecords = sqliteDb.exec("SELECT data FROM records");
    state.records = resRecords.length ? resRecords[0].values.map(row=> JSON.parse(row[0])) : [];
    // Migrasi data lama: berkas N3 dipindahkan menjadi N4.
    state.records.forEach(rec=>{
      rec.berkas = rec.berkas || {};
      if(rec.berkas.n4 === undefined) rec.berkas.n4 = !!rec.berkas.n3;
      delete rec.berkas.n3;
    });
    const resSettings = sqliteDb.exec("SELECT value FROM settings WHERE key='petugas'");
    if(resSettings.length && resSettings[0].values.length){
      state.petugas = JSON.parse(resSettings[0].values[0][0]);
    }
    // Biodata petugas mengikuti biodata pada PDF yang diberikan.
    state.petugas = Object.assign({
      nama:"AJAT SUDRAJAT, SH.", bin:"", nik:"", ttl:"",
      kewarganegaraan:"Indonesia", agama:"Islam", pekerjaan:"", alamat:"",
      wilayah:"", kua:"", kecamatan:"", kabupaten:"", kepalaDesa:"",
      alamatKantor:"Jln. Desa Kadakajaya No.13, Kec. Tanjungsari, Kab. Sumedang, Kode Pos 45363"
    }, state.petugas || {});
  }catch(e){ console.error(e); state.records = []; }
  state.loaded = true;
  if(state.records.length===0) state.tab='dashboard';

  // Deteksi browser/profil baru: kalau belum ada data di tempat ini dan belum pernah
  // "onboarded", tawarkan impor cadangan .db (mungkin datanya ada di browser lain).
  let onboarded = null;
  try{ onboarded = await idbGet('p3nr_onboarded'); }catch(e){}
  state.showOnboardingModal = (!onboarded && state.records.length===0);

  // Pengingat backup rutin: kalau sudah >=7 hari sejak ekspor terakhir (atau belum
  // pernah ekspor sama sekali) dan ada data untuk dibackup, dan belum diingatkan
  // dalam 24 jam terakhir.
  if(!state.showOnboardingModal && state.records.length>0){
    let lastBackup = null, lastReminder = null;
    try{ lastBackup = await idbGet('p3nr_last_backup_at'); }catch(e){}
    try{ lastReminder = await idbGet('p3nr_last_reminder_shown_at'); }catch(e){}
    const now = Date.now();
    const daysSince = (iso)=> iso ? (now - new Date(iso).getTime())/(1000*60*60*24) : Infinity;
    const daysSinceBackup = daysSince(lastBackup);
    const daysSinceReminder = daysSince(lastReminder);
    if(daysSinceBackup >= 7 && daysSinceReminder >= 1){
      state.showBackupReminder = true;
      state._lastBackupDaysAgo = Number.isFinite(daysSinceBackup) ? Math.floor(daysSinceBackup) : null;
    }
  }

  render();
}
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2400);
}

function genNomor(){
  const year = new Date().getFullYear();
  const countThisYear = state.records.filter(r=>r.nomor && r.nomor.includes('/'+year)).length;
  const seq = String(countThisYear+1).padStart(3,'0');
  return `P3NR-${seq}/${year}`;
}
function fmtHariTanggal(d){
  if(!d) return '……………………';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function fmtDate(d){

  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
}

}
function angkaKeHuruf(n){
  const satuan = ['', 'satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];
  function convert(n){
    n = Math.floor(n);
    if(n < 12) return satuan[n] || 'nol';
    if(n < 20) return convert(n-10) + ' belas';
    if(n < 100){
      const sisa = n % 10;
      return convert(Math.floor(n/10)) + ' puluh' + (sisa!==0 ? ' ' + convert(sisa) : '');
    }
    if(n < 200) return 'seratus' + (n%100!==0 ? ' ' + convert(n%100) : '');
    if(n < 1000){
      const sisa = n % 100;
      return convert(Math.floor(n/100)) + ' ratus' + (sisa!==0 ? ' ' + convert(sisa) : '');
    }
    if(n < 2000) return 'seribu' + (n%1000!==0 ? ' ' + convert(n%1000) : '');
    if(n < 1000000){
      const sisa = n % 1000;
      return convert(Math.floor(n/1000)) + ' ribu' + (sisa!==0 ? ' ' + convert(sisa) : '');
    }
    return String(n);
  }
  return convert(n).trim();
}
function fmtHariCetak(){
  return new Date().toLocaleDateString('id-ID',{weekday:'long'});
}
function fmtTanggalBulanCetakEjaan(){
  const dt = new Date();
  const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${angkaKeHuruf(dt.getDate())} ${bulanNama[dt.getMonth()]}`;
}
function fmtTahunCetakEjaan(){
  return angkaKeHuruf(new Date().getFullYear());
}
function tempatTanggalCetak(tempat){
  return `${tempat || '……………………'}, ${fmtTanggalCetak()}`;
}
function fmtRupiah(n){
  if(!n) return "-";
  return "Rp " + Number(n).toLocaleString('id-ID');
}

function navBtn(tab, ic, label){

function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ===================== DASHBOARD ===================== */
function viewDashboard(){
  const total = state.records.length;
  const byStatus = {}; STATUSES.forEach(s=>byStatus[s]=0);
  state.records.forEach(r=>{ byStatus[r.status] = (byStatus[r.status]||0)+1; });
  const terlaksana = byStatus['Terlaksana']||0;
  const proses = total - terlaksana - (byStatus['Dibatalkan']||0);

  const thisMonth = state.records.filter(r=>{
    if(!r.tanggalAkad) return false;
    const d = new Date(r.tanggalAkad+"T00:00:00"); const now = new Date();
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;

  const statusColors = {
    'Diajukan':'var(--ink-soft)','Berkas Lengkap':'var(--gold)','Terjadwal':'var(--stamp-blue)',
    'Terlaksana':'var(--forest)','Dibatalkan':'var(--stamp-red)'
  };

  const recent = [...state.records].sort((a,b)=>(b.tanggalDaftar||'').localeCompare(a.tanggalDaftar||'')).slice(0,5);

  return `
    <div class="topline">
      <div><h2 class="page-title">Dasbor</h2><div class="page-sub">Ringkasan aktivitas pencatatan nikah yang Anda bantu.</div></div>
      <div style="display:flex;gap:10px;">
        ${total===0? `<button class="btn btn-ghost" onclick="loadSampleData()">Muat Data Contoh</button>` : ''}
        <button class="btn btn-primary" onclick="setTab('form')">+ Catatan Baru</button>
      </div>
    </div>
    <hr class="rule">
    <div class="stat-row">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">Total Berkas</div></div>
      <div class="stat-card"><div class="num">${proses}</div><div class="lbl">Dalam Proses</div></div>
      <div class="stat-card"><div class="num">${terlaksana}</div><div class="lbl">Akad Terlaksana</div></div>
      <div class="stat-card"><div class="num">${thisMonth}</div><div class="lbl">Akad Bulan Ini</div></div>
      <div class="stat-card"><div class="num">${state.records.filter(r=>getJenisRegister(r)==='KELUAR').length}</div><div class="lbl">Register Keluar</div></div>
      <div class="stat-card"><div class="num">${state.records.filter(r=>getJenisRegister(r)==='MASUK').length}</div><div class="lbl">Register Masuk</div></div>
    </div>
    <div class="doc-grid" style="grid-template-columns:1.1fr 1fr;">
      <div class="panel">
        <h3>Sebaran Status</h3>
        ${STATUSES.map(s=>{
          const c = byStatus[s]||0; const pct = total? Math.round(c/total*100):0;
          return `<div class="bar-row"><div class="bl">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${statusColors[s]}"></div></div><div class="bn">${c}</div></div>`;
        }).join('')}
      </div>
      <div class="panel">
        <h3>Berkas Terbaru</h3>
        ${recent.length? recent.map(r=>`
          <div class="recent-row" onclick="openDetail('${r.id}')" style="cursor:pointer;">
            <div><div class="nm">${esc(r.suami.nama)||'(nama)'} &amp; ${esc(r.istri.nama)||'(nama)'}</div><div class="sub">${esc(r.nomor)} &middot; ${fmtDate(r.tanggalAkad)}</div></div>
            <span class="stamp st-${STATUS_KEY(r.status)}">${r.status}</span>
          </div>
        `).join('') : `<div class="empty-state" style="padding:20px 0;">Belum ada berkas dicatat.</div>`}
      </div>
    </div>
  `;
}

/* ===================== REGISTER (LIST) ===================== */
function viewRegister(){
  let rows = state.records.filter(r=>{
    const q = state.search.toLowerCase();
    const matchQ = !q || [r.suami.nama,r.istri.nama,r.nomor].some(v=>(v||'').toLowerCase().includes(q));
    const matchS = state.filterStatus==='Semua' || r.status===state.filterStatus;
    return matchQ && matchS;
  }).sort((a,b)=>(b.tanggalDaftar||'').localeCompare(a.tanggalDaftar||''));

  return `
    <div class="topline">
      <div><h2 class="page-title">Register Nikah</h2><div class="page-sub">${state.records.length} berkas tercatat seluruhnya.</div></div>
      <button class="btn btn-primary" onclick="setTab('form')">+ Catatan Baru</button>
    </div>
    <hr class="rule">
    <div class="toolbar">
      <input class="search-box" type="text" placeholder="Cari nama calon pengantin atau nomor..." value="${esc(state.search)}" oninput="state.search=this.value; renderTableOnly();">
      <select onchange="state.filterStatus=this.value; renderTableOnly();">
        <option ${state.filterStatus==='Semua'?'selected':''}>Semua</option>
        ${STATUSES.map(s=>`<option ${state.filterStatus===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div id="tableWrap">${renderTable(rows)}</div>
  `;
}
function renderTable(rows){
  if(rows.length===0){
    return `<div class="empty-state"><div class="stamp-ic">&#10070;</div>Tidak ada berkas yang cocok.<br><span style="font-size:11.5px;">Coba ubah pencarian atau filter status.</span>
    ${state.records.length===0? `<div style="margin-top:14px;"><button class="btn btn-ghost btn-sm" onclick="loadSampleData()">Muat Data Contoh</button></div>`:''}
    </div>`;
  }
  return `
    <table>
      <thead><tr><th>Nomor</th><th>Tgl. Daftar</th><th>Jenis Register</th><th>Calon Suami</th><th>Calon Istri</th><th>Tgl. Akad</th><th>Status</th><th></th></tr></thead>

  `;
}

async function saveDraft(id, isEdit){
  const rec = window.__draft;
  rec.tanggalDaftar = document.getElementById('f_tanggalDaftar').value || rec.tanggalDaftar;
  rec.suami = readPerson('suami');
  rec.istri = readPerson('istri');
  rec.wali = document.getElementById('f_wali').value.trim();
  rec.waliAyahNama = document.getElementById('f_waliAyahNama').value.trim();
  rec.waliHubungan = document.getElementById('f_waliHubungan').value.trim();
  rec.waliNik = document.getElementById('f_waliNik').value.trim();
  rec.waliTtl = document.getElementById('f_waliTtl').value.trim();
  rec.waliKewarganegaraan = document.getElementById('f_waliKewarganegaraan').value.trim() || 'Indonesia';
  rec.waliAgama = document.getElementById('f_waliAgama').value.trim() || 'Islam';
  rec.waliPekerjaan = document.getElementById('f_waliPekerjaan').value.trim();
  rec.waliAlamat = document.getElementById('f_waliAlamat').value.trim();
  rec.saksi1 = document.getElementById('f_saksi1').value.trim();
  rec.saksi2 = document.getElementById('f_saksi2').value.trim();
  rec.tanggalAkad = document.getElementById('f_tanggalAkad').value;
  rec.waktuAkad = document.getElementById('f_waktuAkad').value;
  rec.lokasiAkad = document.getElementById('f_lokasiAkad').value.trim();
  rec.mahar = document.getElementById('f_mahar').value.trim();
  rec.status = document.getElementById('f_status').value;
  rec.catatan = document.getElementById('f_catatan').value.trim();
  BERKAS_ITEMS.forEach(([k])=>{ rec.berkas[k] = document.getElementById(`f_berkas_${k}`).checked; });

  rec.village_id = rec.village_id || (isAdmin() ? state.adminVillageFilter : currentVillageId());
  if(!rec.village_id || rec.village_id==='SEMUA'){
    showToast('Desa register belum dipilih.');
    return;
  }
  rec.created_by = rec.created_by || state.user?.id || '';
  const idx = state.records.findIndex(r=>r.id===id);
  if(idx>=0) state.records[idx]=rec; else state.records.push(rec);
  try{
    await remoteSaveRecord(rec);
  }catch(e){
    console.error('Gagal menyimpan register:',e);
    showToast('Gagal menyimpan ke Supabase: '+(e.message||String(e)));
    render();
    return;
  }
  showToast(isEdit? 'Perubahan tersimpan di Supabase.' : 'Berkas baru tersimpan di Supabase.');
  state.editingId=null; state.detailId=rec.id; state.tab='detail';
  render();
}

async function exportData(){
  const payload = {
    app: "p3nr-register",
    exportedAt: new Date().toISOString(),
    petugas: state.petugas,
    records: state.records,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `p3nr-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  await idbSet('p3nr_last_backup_at', new Date().toISOString());
  showToast("Database diekspor.");
}

function handleImportFile(event){
  const file = event.target.files[0];
  event.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ showToast("File tidak valid: bukan JSON yang benar."); return; }
    if(!data || !Array.isArray(data.records)){
      showToast("File tidak dikenali sebagai berkas cadangan P3NR.");
      return;
    }
    state.importPending = data;
    render();
  };
  reader.readAsText(file);
}

  const div = document.createElement('div');

  div.innerHTML = `

      <p>File berisi <strong>${data.records.length} berkas</strong>${data.exportedAt? ' (diekspor '+fmtDate(data.exportedAt.slice(0,10))+')':''}. Pilih cara mengimpor:</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        <button class="btn btn-primary" style="text-align:left;" onclick="doImport('merge')">Gabungkan &mdash; tambahkan ke data yang ada</button>
        <button class="btn btn-danger" style="text-align:left;" onclick="doImport('replace')">Ganti Semua &mdash; hapus data lama, pakai data file ini</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="state.importPending=null; render();">Batal</button>
      </div>
    </div>
  `;
  document.body.appendChild(div);
}

async function doImport(mode){
  const data = state.importPending;
  if(mode==='replace'){
    state.records = data.records;
    if(data.petugas) state.petugas = data.petugas;
  }else{
    const existingIds = new Set(state.records.map(r=>r.id));
    const existingNomor = new Set(state.records.map(r=>r.nomor));
    let added = 0;
    data.records.forEach(r=>{
      if(existingIds.has(r.id)) r = {...r, id:'r'+Date.now()+Math.random().toString(36).slice(2,7)};
      if(existingNomor.has(r.nomor)) r = {...r, nomor: r.nomor+"-imp"};
      state.records.push(r);
      added++;
    });
  }
  await persistRecords();
  if(mode==='replace' && data.petugas) await persistPetugas();
  state.importPending = null;
  render();
  showToast(mode==='replace' ? "Database diganti dengan data impor." : "Data berhasil digabungkan.");
}

/* ===================== EKSPOR/IMPOR SQLITE (.db) ===================== */
/* File .db portable: bisa dibuka ulang di komputer/browser lain, atau bahkan
   diinspeksi lewat aplikasi terpisah seperti "DB Browser for SQLite".
   Data harian tetap auto-tersimpan di IndexedDB; ekspor .db ini murni untuk
   backup/portabilitas. */
let SQL_LIB = null;
async function getSQL(){
  if(SQL_LIB) return SQL_LIB;
  SQL_LIB = await initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${file}` });
  return SQL_LIB;
}
async function exportSqlite(){
  try{
    const binaryArray = sqliteDb.export();
    const blob = new Blob([binaryArray], {type:"application/x-sqlite3"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `p3nr-backup-${stamp}.db`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    await idbSet('p3nr_last_backup_at', new Date().toISOString());
    showToast("Database SQLite (.db) diekspor.");
  }catch(e){
    console.error(e);
    showToast("Gagal mengekspor database SQLite.");
  }
}
function handleImportSqliteFile(event){
  const file = event.target.files[0];
  event.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const SQLlib = await getSQL();
      const uint8 = new Uint8Array(e.target.result);
      const db = new SQLlib.Database(uint8);
      let petugas = null, exportedAt = null, records = [];
      try{
        const resSettings = db.exec("SELECT key, value FROM settings");
        if(resSettings.length){
          resSettings[0].values.forEach(row=>{
            if(row[0]==='petugas') petugas = JSON.parse(row[1]);
            if(row[0]==='exportedAt') exportedAt = row[1];
          });
        }
      }catch(err){}
      try{
        const resRecords = db.exec("SELECT data FROM records");
        if(resRecords.length) records = resRecords[0].values.map(row=> JSON.parse(row[0]));
      }catch(err){}
      db.close();
      if(!records.length && !petugas){
        showToast("File .db tidak dikenali sebagai berkas cadangan P3NR.");
        return;
      }
      state.importPending = { app:"p3nr-register", exportedAt, petugas, records };
      render();
    }catch(err){
      console.error(err);
      showToast("File .db tidak valid atau rusak.");
    }
  };
  reader.readAsArrayBuffer(file);
}

  if(!r.tanggalDaftar) return null;

async function seedDefaultVillagesTanjungsari(){
  // Jalankan hanya setelah supabaseClient dibuat dan sesi autentikasi tersedia.
  // Petugas tidak boleh melakukan insert; seed desa cukup dilakukan oleh admin.
  if(!supabaseClient || !state.user || !isAdmin()) return;
  try{
    const {data:existing,error:e1}=await supabaseClient.from("villages").select("name").eq("kecamatan","Tanjungsari");
    if(e1){ console.warn("Baca master desa gagal:",e1.message); return; }
    const names=new Set((existing||[]).map(x=>String(x.name||"").trim().toLowerCase()));
    const missing=DEFAULT_VILLAGES_TANJUNGSARI.filter(v=>!names.has(v.name.toLowerCase()));
    if(!missing.length) return;
    const {error:e2}=await supabaseClient.from("villages").insert(missing.map(v=>({
      name:v.name,kecamatan:v.kecamatan,kabupaten:v.kabupaten,provinsi:v.provinsi
    })));
    if(e2) console.warn("Seed desa gagal:",e2.message);
  }catch(err){ console.warn("Seed desa gagal:",err); }
}

async function bootMultiDesa(){
  if(!isConfigured()){
    state.configReady=false; state.authReady=true; render(); return;
  }
  try{
    supabaseClient = window.supabase.createClient(MULTI_DESA_CONFIG.SUPABASE_URL, MULTI_DESA_CONFIG.SUPABASE_ANON_KEY);
    const {data:{session}} = await supabaseClient.auth.getSession();
    state.user = session?.user || null;
    state.configReady=true;
    if(state.user){
      await loadRemoteState();
      // Hanya admin yang boleh melakukan seed master desa.
      await seedDefaultVillagesTanjungsari();
      // Jika seed menambah desa, muat ulang daftar desa tanpa mengganggu sesi.
      if(isAdmin()) await loadRemoteState();
    }
    state.authReady=true;
    render();
    let authLoadSeq = 0;
    supabaseClient.auth.onAuthStateChange((_event, session)=>{
      const event = _event;
      state.user = session?.user || null;
      if(!state.user){
        state.profile=null; state.villages=[]; state.records=[]; state.petugas={}; state.authError='';
        state.authReady=true; render();
        return;
      }
      // Jangan memuat ulang data pada TOKEN_REFRESHED. Event ini bisa terjadi berkali-kali
      // dan sebelumnya berpotensi menimpa state setelah proses simpan selesai.
      if(['SIGNED_IN','INITIAL_SESSION','USER_UPDATED'].includes(event)){
        const seq=++authLoadSeq;
        Promise.resolve().then(async()=>{
          await loadRemoteState();
          if(seq!==authLoadSeq) return;
          state.authReady=true; render();
        }).catch(e=>{
          if(seq!==authLoadSeq) return;
          console.error(e); state.authError=e.message||String(e); state.authReady=true; render();
        });
      }
    });
  }catch(e){
    console.error(e); state.authError=e.message||String(e); state.authReady=true; render();
  }
}

async function loadRemoteState(){
  state.authError='';
  if(!supabaseClient || !state.user?.id) throw new Error('Koneksi Supabase belum siap atau sesi login tidak tersedia.');

  const userId=state.user.id;
  const {data:profile,error:pe} = await supabaseClient.from('profiles').select('*').eq('id',userId).maybeSingle();
  if(pe){
    // Jangan samarkan error RLS/koneksi sebagai "profil belum dibuat".
    throw new Error('Gagal membaca profil otoritas: '+(pe.message||String(pe)));
  }
  if(!profile){
    state.profile=null; state.records=[]; state.villages=[];
    state.authError='Profil otoritas akun belum ditemukan. Pastikan UID pada public.profiles.id sama persis dengan User UID di Authentication > Users.';
    return;
  }
  if(profile.active===false){ await supabaseClient.auth.signOut(); throw new Error('Akun dinonaktifkan.'); }
  state.profile=profile;
  loadProfileAvatar();
  const {data:villages,error:ve}=await supabaseClient.from('villages').select('*').order('name');
  if(ve) throw ve;
  state.villages=villages||[];
  if(!isAdmin() && currentVillageId()) state.adminVillageFilter=currentVillageId();
  const {data:settings,error:se}=await supabaseClient.from('village_settings').select('*');
  if(se) throw se;
  state.villageSettingsMap={};
  (settings||[]).forEach(x=>state.villageSettingsMap[x.village_id]=x.data||{});
  const query=supabaseClient.from('registers').select('*').order('tanggal_daftar',{ascending:false});
  const {data:rows,error:re}=await (isAdmin()?query:query.eq('village_id',currentVillageId()));
  if(re) throw new Error('Gagal membaca data register: '+(re.message||String(re)));
  const mappedRows=(rows||[]).map(x=>{const r={...(x.data||{}),id:x.id,nomor:x.nomor,tanggalDaftar:x.tanggal_daftar,village_id:x.village_id,created_by:x.created_by,updated_at:x.updated_at}; if(!r.jenisRegister) r.jenisRegister=getJenisRegister(r); return r;});
  // Hanya mengganti cache setelah query berhasil. Ini mencegah kegagalan jaringan/RLS
  // menghapus data yang sedang tampil di layar. Jika query sukses dan memang kosong,
  // kosong adalah kondisi database yang sebenarnya.
  state.records=mappedRows;
  const sid=isAdmin()?state.adminVillageFilter:currentVillageId();
  state.petugas = {...defaultPetugas(), ...(sid!=='SEMUA'?settingsForVillage(sid):{})};
}
function defaultPetugas(){
  return {nama:'',bin:'',nik:'',ttl:'',kewarganegaraan:'Indonesia',agama:'Islam',pekerjaan:'',alamat:'',wilayah:'',kua:'',kecamatan:'',kabupaten:'',kepalaDesa:'',alamatKantor:''};
}
function recordsVisible(){
  if(!isAdmin()) return state.records;
  if(state.adminVillageFilter==='SEMUA') return state.records;
  return state.records.filter(r=>r.village_id===state.adminVillageFilter);
}

async function remoteSaveRecord(rec){
  if(!supabaseClient || !state.user?.id) throw new Error('Sesi login Supabase tidak tersedia.');
  const villageId = rec.village_id || currentVillageId();
  if(!villageId || villageId==='SEMUA') throw new Error('Desa register belum ditentukan.');
  const normalized = {...rec, village_id:villageId};
  const payload={
    id:normalized.id,
    village_id:villageId,
    nomor:normalized.nomor || '',
    tanggal_daftar:normalized.tanggalDaftar || null,
    data:normalized,
    created_by:normalized.created_by || state.user.id,
    updated_by:state.user.id
  };
  const {error}=await supabaseClient.from('registers').upsert(payload,{onConflict:'id'});
  if(error) throw error;
  return normalized;
}
async function persistRecords(recordsToSave=null){
  if(!supabaseClient||!state.user) throw new Error('Sesi login Supabase tidak tersedia.');
  const list = Array.isArray(recordsToSave) ? recordsToSave : state.records;
  for(const r of list){
    if(!r.village_id) r.village_id=currentVillageId();
    await remoteSaveRecord(r);
  }
}
async function persistPetugas(){
  if(!supabaseClient||!state.user) return;
  const vid=isAdmin()?state.adminVillageFilter:currentVillageId();
  if(!vid || vid==='SEMUA') return;
  const {error}=await supabaseClient.from('village_settings').upsert({village_id:vid,data:state.petugas,updated_by:state.user.id},{onConflict:'village_id'});
  if(error) throw error;
  state.villageSettingsMap[vid]=state.petugas;
}

function makeId(){
  if(window.crypto?.randomUUID) return window.crypto.randomUUID();
  return 'r'+Date.now()+Math.random().toString(16).slice(2);
}
function genNomor(){
  const year=new Date().getFullYear();
  const scope=isAdmin()&&state.adminVillageFilter!=='SEMUA'?state.adminVillageFilter:currentVillageId();
  const count=state.records.filter(r=>(r.village_id||scope)===scope && (r.nomor||'').includes('/'+year)).length;
  return `P3NR-${String(count+1).padStart(3,'0')}/${year}`;
}

async function saveDraft(id,isEdit){

  // Jenis register mengikuti orang yang dibuatkan N.1/NA.
  rec.jenisRegister = getJenisRegister(rec);
  rec.village_id=rec.village_id||(isAdmin()?state.adminVillageFilter:currentVillageId()); rec.updated_by=state.user.id;
  if(!rec.village_id || rec.village_id==='SEMUA'){showToast('Pilih desa terlebih dahulu sebelum membuat register.');return;}
  const idx=state.records.findIndex(r=>r.id===id); if(idx>=0) state.records[idx]=rec; else state.records.push(rec);
  try{await remoteSaveRecord(rec); showToast(isEdit?'Perubahan disimpan.':'Berkas baru disimpan.');}catch(e){console.error(e);showToast('Gagal menyimpan ke database online: '+(e.message||''));return;}
  state.editingId=null; state.detailId=rec.id; state.tab='detail'; await loadRemoteState(); render();
}

async function confirmDelete(){
  const id=state.confirmDeleteId;
  const rec=state.records.find(r=>r.id===id);
  if(!rec) return;
  const {error}=await supabaseClient.from('registers').delete().eq('id',id);
  if(error){showToast('Gagal menghapus: '+error.message);return;}
  state.records=state.records.filter(r=>r.id!==id); state.confirmDeleteId=null; state.tab='register'; state.detailId=null; render(); showToast('Berkas dihapus.');
}
async function confirmDeleteAll(){
  if(isAdmin() && state.adminVillageFilter==='SEMUA'){showToast('Untuk keamanan, pilih satu desa sebelum menghapus seluruh register desa tersebut.');return;}
  let q=supabaseClient.from('registers').delete().neq('id','__never__');
  if(!isAdmin() || state.adminVillageFilter!=='SEMUA') q=q.eq('village_id',isAdmin()?state.adminVillageFilter:currentVillageId());
  const {error}=await q;
  if(error){showToast('Gagal menghapus: '+error.message);return;}
  await loadRemoteState(); state.confirmDeleteAll=false; state.tab='dashboard'; render(); showToast('Data yang berada dalam cakupan Anda telah dihapus.');
}

function updateLoginAuthority(){

async function doLogin(){
  const email=document.getElementById('login_email')?.value.trim()||'', password=document.getElementById('login_password')?.value||'';
  const expectedRole=document.querySelector('input[name="login_role"]:checked')?.value||'admin_kecamatan';
  if(!email||!password){showToast('Email dan password wajib diisi.');return;}
  state.authError='';
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){state.authError=error.message;render();return;}
  state.user=data.user;
  try{
    await loadRemoteState();
    if(!state.profile){await supabaseClient.auth.signOut();state.user=null;state.profile=null;state.authError='Profil otoritas akun belum dibuat di database.';render();return;}
    if(state.profile.role!==expectedRole){await supabaseClient.auth.signOut();state.user=null;state.profile=null;state.authError='Otoritas yang dipilih tidak sesuai dengan akun ini. Silakan pilih otoritas yang benar.';render();return;}
    if(expectedRole==='petugas_desa'&&!state.profile.village_id){await supabaseClient.auth.signOut();state.user=null;state.profile=null;state.authError='Akun Petugas Desa belum memiliki wilayah tugas. Hubungi Admin Kecamatan.';render();return;}
    render();
  }catch(e){console.error(e);state.authError=e.message||String(e);render();}
}

function getJenisRegister(rec){
  if(!rec) return '';

  if(rec.jenisRegister === 'KELUAR' || rec.jenisRegister === 'MASUK') return rec.jenisRegister;
  return rec.__n1Person === 'istri' ? 'MASUK' : 'KELUAR';
}
function jenisRegisterLabel(rec){

  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session?.access_token) throw new Error('Sesi Admin tidak tersedia.');
    if(!MULTI_DESA_CONFIG.ADMIN_PASSWORD_RESET_URL) throw new Error('Layanan reset password Admin belum dikonfigurasi.');
    const res=await fetch(MULTI_DESA_CONFIG.ADMIN_PASSWORD_RESET_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({targetUserId:state.passwordTarget.id,newPassword:a})});
    const out=await res.json().catch(()=>({}));
	if(!res.ok) throw new Error(out.error||'Gagal mengubah password.');
	const targetName = state.passwordTarget.name;
	closeAdminPasswordModal();
	showToast('Password akun '+targetName+' berhasil diubah.');
  }catch(e){showToast(e.message||'Gagal mengubah password.');}
}

async function addVillage(){
  const name=document.getElementById('v_name').value.trim(); if(!name){showToast('Nama desa wajib diisi.');return;}
  const row={name,kecamatan:document.getElementById('v_kecamatan').value.trim(),kabupaten:document.getElementById('v_kabupaten').value.trim(),provinsi:document.getElementById('v_provinsi').value.trim(),kode:document.getElementById('v_kode').value.trim(),created_by:state.user.id};
  const {data,error}=await supabaseClient.from('villages').insert(row).select().single(); if(error){showToast('Gagal menambah desa: '+error.message);return;}
  state.villages.push(data); state.villages.sort((a,b)=>a.name.localeCompare(b.name)); render(); showToast('Desa ditambahkan.');
}

function viewSettings(){
  const p=state.petugas||defaultPetugas(); const canEdit=!!(isAdmin()?state.adminVillageFilter!=='SEMUA':currentVillageId());
  return `<div class="topline"><div><h2 class="page-title">Pengaturan ${isAdmin()?'Desa':''}</h2><div class="page-sub">Identitas desa yang digunakan pada kop dan dokumen cetak.</div></div></div><hr class="rule">${isAdmin()?`<div class="form-section"><h3>Pilih Desa</h3><select onchange="state.adminVillageFilter=this.value;syncSelectedVillageSettings();render()"><option value="SEMUA" ${state.adminVillageFilter==='SEMUA'?'selected':''}>Semua Desa</option>${state.villages.map(v=>`<option value="${escapeAttr(v.id)}" ${state.adminVillageFilter===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>`:''}<div class="form-section"><h3>Biodata Petugas / Penanggung Jawab</h3><div class="grid2"><div class="field"><label>Nama</label><input id="s_nama" value="${esc(p.nama)}"></div><div class="field"><label>Bin</label><input id="s_bin" value="${esc(p.bin)}"></div><div class="field"><label>NIK</label><input id="s_nik" maxlength="16" value="${esc(p.nik)}"></div><div class="field"><label>Tempat dan tanggal lahir</label><input id="s_ttl" value="${esc(p.ttl)}"></div><div class="field"><label>Kewarganegaraan</label><input id="s_kewarganegaraan" value="${esc(p.kewarganegaraan||'Indonesia')}"></div><div class="field"><label>Agama</label><input id="s_agama" value="${esc(p.agama||'Islam')}"></div><div class="field"><label>Pekerjaan</label><input id="s_pekerjaan" value="${esc(p.pekerjaan)}"></div><div class="field"><label>Alamat</label><input id="s_alamat" value="${esc(p.alamat)}"></div></div></div><div class="form-section"><h3>Identitas Desa &amp; KUA</h3><div class="grid2"><div class="field"><label>Wilayah Tugas (Desa/Kelurahan)</label><input id="s_wilayah" value="${esc(p.wilayah|| (state.adminVillageFilter!=='SEMUA'?villageName(state.adminVillageFilter):''))}"></div><div class="field"><label>Nama KUA</label><input id="s_kua" value="${esc(p.kua)}"></div><div class="field"><label>Kecamatan</label><input id="s_kecamatan" value="${esc(p.kecamatan)}"></div><div class="field"><label>Kabupaten</label><input id="s_kabupaten" value="${esc(p.kabupaten)}"></div><div class="field"><label>Nama Kepala Desa</label><input id="s_kepalaDesa" value="${esc(p.kepalaDesa)}"></div><div class="field"><label>Alamat Kantor Desa</label><input id="s_alamatKantor" value="${esc(p.alamatKantor)}"></div></div></div><div class="form-actions"><button class="btn btn-primary" ${canEdit?'':'disabled'} onclick="saveSettings()">Simpan Pengaturan Desa</button></div><div class="form-section"><h3>Status Sistem</h3><p class="muted">Terhubung ke database online. Data register, identitas desa, dan otoritas akun disimpan di Supabase; pembatasan desa dilakukan oleh RLS.</p></div>`;
}
async function saveSettings(){
  if(isAdmin()&&state.adminVillageFilter==='SEMUA'){showToast('Pilih satu desa terlebih dahulu.');return;}
  state.petugas={nama:document.getElementById('s_nama').value.trim(),bin:document.getElementById('s_bin').value.trim(),nik:document.getElementById('s_nik').value.trim(),ttl:document.getElementById('s_ttl').value.trim(),kewarganegaraan:document.getElementById('s_kewarganegaraan').value.trim()||'Indonesia',agama:document.getElementById('s_agama').value.trim()||'Islam',pekerjaan:document.getElementById('s_pekerjaan').value.trim(),alamat:document.getElementById('s_alamat').value.trim(),wilayah:document.getElementById('s_wilayah').value.trim(),kua:document.getElementById('s_kua').value.trim(),kecamatan:document.getElementById('s_kecamatan').value.trim(),kabupaten:document.getElementById('s_kabupaten').value.trim(),kepalaDesa:document.getElementById('s_kepalaDesa').value.trim(),alamatKantor:document.getElementById('s_alamatKantor').value.trim()};
  try{await persistPetugas();showToast('Pengaturan desa disimpan.');render();}catch(e){showToast('Gagal menyimpan pengaturan: '+e.message);}
}

/* Hanya data yang telah lolos RLS yang masuk ke state.records. */
bootMultiDesa();

</script>
